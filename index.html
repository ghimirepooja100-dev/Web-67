<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Space</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <div class="card">

            <div class="top-bar">
                <span class="status"></span>
                <span>ONLINE</span>
            </div>

            <div class="profile">

                <div class="avatar">
                    <span>👾</span>
                </div>

                <h1>Your Name</h1>

                <p class="username">@YourDiscordUsername</p>

                <p class="bio">
                    Welcome to my digital space.
                </p>

            </div>


            <div class="stats">

                <div class="stat">
                    <strong id="clock">00:00:00</strong>
                    <span>LOCAL TIME</span>
                </div>

                <div class="stat">
                    <strong>DISCORD</strong>
                    <span>STATUS</span>
                </div>

            </div>


            <div class="discord-box">

                <div>
                    <p>DISCORD ID</p>
                    <strong id="discordId">YOUR_DISCORD_ID</strong>
                </div>

                <button id="copyButton">
                    COPY
                </button>

            </div>


            <p id="message"></p>

            <div class="buttons">

                <button class="main-button" id="helloButton">
                    SAY HELLO
                </button>

                <button class="secondary-button" id="themeButton">
                    CHANGE MODE
                </button>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
